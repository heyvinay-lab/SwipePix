name: 🐛 Bug Report
description: Report an issue or unexpected behavior in SwipePix
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and fix it.
  - type: input
    id: version
    attributes:
      label: SwipePix Version
      description: What version of SwipePix are you using? (e.g. v1.0.0)
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device Model & Android Version
      description: e.g. Pixel 8 (Android 14) or Samsung Galaxy S23 (Android 14)
      placeholder: Pixel 8, Android 14
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open SwipePix
        2. Tap on album 'Screenshots'
        3. Swipe left to trash
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: checkboxes
    id: privacy-confirm
    attributes:
      label: Confirmation
      options:
        - label: I confirm this issue report does not contain any private media or personal data.
          required: true
